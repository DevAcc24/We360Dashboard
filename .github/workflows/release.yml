name: Build and release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        shell: pwsh
        run: |
          # тестові проєкти - ті, що посилаються на Microsoft.NET.Test.Sdk
          $tests = Get-ChildItem -Recurse -Filter *.csproj |
            Where-Object { Select-String -Path $_.FullName -Pattern 'Microsoft.NET.Test.Sdk' -Quiet }
          if (-not $tests) { Write-Host 'Тестів немає, пропускаю.'; exit 0 }
          foreach ($t in $tests) {
            dotnet test $t.FullName -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish
        shell: pwsh
        run: |
          # версія береться з csproj (VersionPrefix) + номер запуску
          $version = dotnet msbuild app/We360Dashboard -getProperty:Version -p:BuildNumber=$env:BUILD_NUMBER
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw 'Не вдалося прочитати версію з csproj' }
          "VERSION=$version" >> $env:GITHUB_ENV
          dotnet publish app/We360Dashboard -c Release -o dist -p:BuildNumber=$env:BUILD_NUMBER

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # при перезапуску (Re-run) номер запуску той самий, тож реліз уже може існувати - тоді лише оновлюємо файл
          gh release view "v$env:VERSION" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$env:VERSION" dist/We360Dashboard.exe --clobber
          } else {
            gh release create "v$env:VERSION" dist/We360Dashboard.exe `
              --target $env:GITHUB_SHA `
              --title "v$env:VERSION" `
              --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
